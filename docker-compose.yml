version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: threatintel_postgres
    restart: always
    environment:
      POSTGRES_DB: threatintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threatintel"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - threatintel_net

  redis:
    image: redis:7-alpine
    container_name: threatintel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - threatintel_net

  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    container_name: threatintel_collector
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=threatintel
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COLLECTOR_PORT=5001
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threatintel_net

  enricher:
    build:
      context: .
      dockerfile: services/enricher/Dockerfile
    container_name: threatintel_enricher
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=threatintel
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENRICHER_POLL_INTERVAL=1.0
      - ENRICHER_BATCH_SIZE=50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threatintel_net

  api_server:
    build:
      context: .
      dockerfile: services/api_server/Dockerfile
    container_name: threatintel_api_server
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=threatintel
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PORT=5000
      - REDIS_CACHE_TTL=60
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threatintel_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: threatintel_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api_server
      - collector
    networks:
      - threatintel_net

networks:
  threatintel_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
