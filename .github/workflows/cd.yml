name: Continuous Deployment (CD)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ============================================================================
  # Stage 1: Build & Publish Container Images to GitHub Container Registry (GHCR)
  # ============================================================================
  publish-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: collector
            context: .
            dockerfile: services/collector/Dockerfile
            image: collector
          - name: enricher
            context: .
            dockerfile: services/enricher/Dockerfile
            image: enricher
          - name: api_server
            context: .
            dockerfile: services/api_server/Dockerfile
            image: api_server
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
            image: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2: Zero-Downtime Deployment & Smoke Tests
  # ============================================================================
  deploy:
    name: Deploy to Production
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Production Host
        if: ${{ secrets.PROD_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/threat-intelligence-platform
            git pull origin main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh .env.production

      - name: Self-Hosted / Simulated Deployment Verification
        if: ${{ secrets.PROD_SSH_HOST == '' }}
        run: |
          echo "==========================================================="
          echo "Notice: PROD_SSH_HOST secret not configured."
          echo "Successfully validated CD pipeline artifacts and container images in GHCR:"
          echo "  - ${{ env.IMAGE_PREFIX }}/collector:latest"
          echo "  - ${{ env.IMAGE_PREFIX }}/enricher:latest"
          echo "  - ${{ env.IMAGE_PREFIX }}/api_server:latest"
          echo "  - ${{ env.IMAGE_PREFIX }}/frontend:latest"
          echo "To enable direct push-to-deploy, add PROD_SSH_HOST, PROD_SSH_USER, and PROD_SSH_KEY to repository secrets."
          echo "==========================================================="
